<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>RideWay</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/lib/leaflet/leaflet.css" />
<script src="/lib/leaflet/leaflet.js"></script>
<style>
  /* Имена переменных (--bg2, --section, --text, --hint, --accent, --ok, --sep) использует и редактор схемы салона seat-editor.js. */
  :root {
    --bg2: #F3F4EF; --section: #FFFFFF; --text: #14201B; --hint: #5A665F; --sep: #E2E5DD; --soft: #E2E5DD;
    --accent: #0F5F47; --accent-text: #FFFFFF; --ok: #0F5F47; --tint: #DCEBE4; --amber: #F2B43A; --amber-text: #14201B;
    --danger: #A8321F; --link: #0F5F47; --radius: 20px;
  }
  /* Экран водителя: тёмная тема и крупные кнопки — им пользуются за рулём и затемно. */
  html.drv {
    --bg2: #0E1512; --section: #18221D; --text: #F1F4F0; --hint: #A3B0A8; --sep: #2A3830; --soft: #18221D;
    --accent: #3DDC97; --accent-text: #0E1512; --ok: #3DDC97; --tint: #2A3830; --danger: #FFA98F; --link: #3DDC97;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg2); color: var(--text);
    font: 15px/1.4 Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { padding: 16px 16px 96px; max-width: 560px; margin: 0 auto; }
  h1 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin: 0 0 12px; line-height: 1.15; }
  h2 { font-size: 15px; font-weight: 800; margin: 18px 4px 8px; }
  a { color: var(--link); text-decoration: none; font-weight: 700; }
  .eyebrow { font-size: 13px; font-weight: 600; color: var(--hint); margin: 0 0 2px; }
  .card { background: var(--section); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; }
  .list { background: var(--section); border-radius: var(--radius); overflow: hidden; margin-bottom: 12px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--sep); min-height: 52px; }
  .row:last-child { border-bottom: 0; }
  .row.sel { background: var(--tint); }
  .grow { flex: 1; min-width: 0; }
  .title { font-weight: 700; }
  .hint { color: var(--hint); font-size: 13px; }
  .big { font-size: 48px; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; }
  .muted { opacity: .6; }
  .flex { display: flex; gap: 8px; align-items: center; }
  .between { justify-content: space-between; }
  .end { align-items: flex-end; }
  .center { text-align: center; }
  .spacer { height: 10px; }
  .g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .g1 { display: grid; gap: 8px; }
  .chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: var(--soft); color: var(--text); white-space: nowrap; }
  .chip.ok { background: var(--tint); color: var(--ok); }
  .chip.bad { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }
  .chip.warn { background: var(--amber); color: var(--amber-text); }
  svg.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  button { font: inherit; font-weight: 700; border: 0; cursor: pointer; border-radius: 14px; padding: 0 16px; min-height: 46px;
    background: var(--soft); color: var(--text); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-text); font-weight: 800; }
  button.block { width: 100%; min-height: 56px; font-size: 17px; border-radius: 16px; }
  button.line { background: transparent; border: 1.5px solid color-mix(in srgb, var(--hint) 55%, transparent); }
  button.danger { color: var(--danger); }
  button.sm { min-height: 44px; padding: 0 14px; font-size: 14px; }
  button.round { width: 46px; padding: 0; border-radius: 50%; }
  button.xl { min-height: 68px; font-size: 20px; font-weight: 800; border-radius: 18px; }

  .seg { display: flex; background: var(--soft); border-radius: 14px; padding: 4px; gap: 4px; margin-bottom: 12px; }
  .seg button { flex: 1; background: transparent; min-height: 44px; padding: 0 6px; font-size: 14px; font-weight: 600; border-radius: 11px; color: var(--hint); }
  .seg button.active { background: var(--section); color: var(--text); font-weight: 800; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  html.drv .seg button.active { background: var(--tint); }
  .radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--hint); flex: none; background: var(--section); }
  .radio.on { border: 7px solid var(--accent); }
  .steps { display: grid; gap: 6px; margin-bottom: 10px; }
  .steps i { height: 5px; border-radius: 3px; background: var(--soft); }
  .steps i.on { background: var(--accent); }

  /* Главная карточка ближайшей поездки */
  .hero { background: #0F5F47; color: #fff; border-radius: 24px; padding: 20px; margin-bottom: 12px; display: grid; gap: 16px; }
  .hero .eyebrow { color: #CFE3DA; text-transform: uppercase; letter-spacing: .04em; font-weight: 700; margin: 0; }
  .hero .clock { font-size: 64px; font-weight: 800; line-height: .95; letter-spacing: -.04em; }
  .hero .sub { font-size: 14px; font-weight: 600; color: #CFE3DA; padding-bottom: 4px; }
  .hero .cell { background: #1B7359; border-radius: 14px; padding: 10px 12px; min-width: 0; }
  .hero .cell small { display: block; font-size: 11px; font-weight: 600; color: #CFE3DA; }
  .hero .cell b { display: block; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hero button.white { background: #fff; color: #0F5F47; font-weight: 800; }
  .hero button.ghost { background: transparent; border: 1.5px solid #7FB5A1; color: #fff; }
  .hero .note { font-size: 13px; color: #CFE3DA; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--tint); color: var(--accent); font-weight: 800; font-size: 16px;
    display: flex; align-items: center; justify-content: center; flex: none; }

  /* Неделя */
  .wkrow { display: grid; grid-template-columns: 52px minmax(0, 1fr) minmax(0, 1fr); gap: 8px; align-items: center; margin-bottom: 8px; }
  .wkhead { font-size: 12px; font-weight: 700; color: var(--hint); }
  .wk { min-height: 60px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px;
    font-size: 15px; font-weight: 800; line-height: 1.2; width: 100%; text-align: center; }
  .wk small { font-size: 12px; font-weight: 600; }
  .wk.on { background: var(--accent); color: var(--accent-text); }
  .wk.on small { opacity: .85; }
  .wk.absent { background: var(--section); border: 1.5px dashed var(--hint); color: var(--text); }
  .wk.add { background: var(--section); border: 1.5px solid var(--accent); color: var(--accent); }
  .wk.off { background: var(--soft); color: var(--hint); font-weight: 700; }
  .wk.done { background: var(--tint); color: var(--ok); }
  .wk.bad { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }

  .tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--section);
    border-top: 1px solid var(--sep); padding: 6px 4px calc(8px + env(safe-area-inset-bottom)); z-index: 5; }
  .tabs button { flex: 1; background: none; padding: 2px; min-height: 48px; flex-direction: column; gap: 2px; font-size: 11px; font-weight: 600; color: var(--hint); border-radius: 10px; }
  .tabs button.active { color: var(--accent); font-weight: 800; }
  .toast { position: fixed; left: 12px; right: 12px; bottom: 88px; background: #14201B; color: #fff;
    padding: 12px 14px; border-radius: 14px; font-size: 14px; font-weight: 600; opacity: 0; transform: translateY(8px);
    transition: .2s; pointer-events: none; z-index: 10; max-width: 536px; margin: 0 auto; }
  .toast.show { opacity: .96; transform: none; }
  .photo { width: 100%; max-height: 220px; object-fit: cover; border-radius: 14px; display: block; margin-bottom: 10px; }

  /* Карта маршрута (Leaflet + OpenStreetMap). isolation — чтобы слои карты не перекрывали QR-оверлей и вкладки */
  .map { height: 240px; border-radius: var(--radius); overflow: hidden; margin-bottom: 12px; isolation: isolate; background: var(--soft); }
  .pin { position: relative; width: 28px; height: 28px; border-radius: 50%; background: #0F5F47; color: #fff;
    border: 2px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center;
    font: 700 13px/1 system-ui, sans-serif; transition: transform .15s; }
  .pin.office { background: #14201B; }
  .pin.sel { background: #F2B43A; color: #14201B; transform: scale(1.3); }
  .pin b { position: absolute; top: -9px; right: -9px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: #111;
    color: #fff; font: 700 11px/18px system-ui, sans-serif; text-align: center; border: 1px solid #fff; }
  .leaflet-tooltip { font: 600 12px system-ui, sans-serif; }

  /* QR для посадки на весь экран: фон всегда белый, чтобы код читался и в тёмной теме */
  .overlay { position: fixed; inset: 0; z-index: 20; background: #fff; color: #111; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 20px; text-align: center; }
  .overlay img { width: min(78vw, 380px); height: auto; image-rendering: pixelated; }
  .overlay button { width: 100%; max-width: 320px; background: #0F5F47; color: #fff; }

  /* Схема салона */
  .car { display: grid; gap: 10px; justify-content: center; width: fit-content; margin: 6px auto; padding: 22px 18px 16px;
    border: 2px solid var(--sep); border-radius: 48px 48px 24px 24px; background: var(--bg2); }
  .seat { height: 64px; border-radius: 14px; border: 2px solid var(--sep); display: flex; flex-direction: column; align-items: center;
    justify-content: center; font-weight: 800; font-size: 18px; line-height: 1.1; background: var(--section); user-select: none; min-width: 0; }
  .seat small { font-size: 10px; font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }
  .seat.free { border-color: var(--accent); color: var(--accent); cursor: pointer; }
  .seat.taken { background: var(--soft); color: var(--hint); border-color: transparent; }
  .seat.mine, .seat.sel { background: var(--accent); border-color: var(--accent); color: var(--accent-text); cursor: pointer; }
  .seat.wheel { border: 0; background: none; color: var(--hint); }
  .seat.empty { visibility: hidden; }
  .legend { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; font-size: 12px; color: var(--hint); margin-top: 8px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; border: 2px solid; vertical-align: -2px; margin-right: 4px; }
  .legend .f { border-color: var(--accent); }
  .legend .t { background: var(--soft); border-color: transparent; }
  .legend .s { background: var(--accent); border-color: var(--accent); }

  /* Водитель */
  .count { font-size: 72px; font-weight: 800; line-height: .95; letter-spacing: -.04em; }
  .count span { color: var(--hint); }
  .alert { background: #3A2E12; color: #FBE3A8; border-radius: 16px; padding: 12px 14px; font-weight: 700; margin-bottom: 12px; }
  .num { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--accent-text); font-size: 18px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; flex: none; }
  .num.zero { background: none; border: 1.5px solid var(--hint); color: var(--hint); }
  .seatno { width: 48px; height: 48px; border-radius: 14px; background: var(--tint); font-size: 20px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; flex: none; }
  .tm { width: 56px; font-size: 19px; font-weight: 800; flex: none; }
  .stat { background: var(--section); border-radius: 18px; padding: 14px; }
  .stat b { display: block; font-size: 28px; font-weight: 800; }
</style>
<script src="/js/seat-editor.js"></script>
</head>
<body>
<main id="view"><div class="center hint" style="padding:40px 16px">Загрузка…</div></main>
<nav class="tabs" id="tabs" hidden></nav>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();

const S = {
  me: null, tab: 'today', routes: null, route: null, step: 1, stopId: null, dirs: 'both',
  seat: null,            // выбранное постоянное место
  oneOff: null,          // {date, dir} — выбор места на разовую поездку
  seat1: null,           // выбранное место на разовую поездку
  survey: {},            // ответы опроса листа ожидания
  driver: { routeId: null, date: null, dir: null, view: 'trip', step: 0, overview: false },
  back: null,
};
const $view = document.getElementById('view');
const devUser = new URLSearchParams(location.search).get('dev');

// ───────── иконки ─────────
const svg = d => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const IC = {
  car: svg('<path d="M5 17h14M6 17l1-7h10l1 7M8 10l1-4h6l1 4"/><circle cx="8" cy="18.5" r="1.5"/><circle cx="16" cy="18.5" r="1.5"/>'),
  week: svg('<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>'),
  route: svg('<circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H14a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h5.5"/>'),
  pay: svg('<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M7 15h4"/>'),
  wheel: svg('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M3.5 10.5 9.6 11M20.5 10.5 14.4 11M12 14.5V21"/>'),
  qr: svg('<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2v2M20 14v6h-4M14 20v-2"/>'),
  scan: svg('<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 12h8"/>'),
  phone: svg('<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>'),
  nav: svg('<path d="M20 4 4 11l7 2 2 7 7-16z"/>'),
  check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
  share: svg('<path d="M12 15V4M8 8l4-4 4 4M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/>'),
  left: svg('<path d="M15 5l-7 7 7 7"/>'),
  right: svg('<path d="M9 5l7 7-7 7"/>'),
};

// ───────── утилиты ─────────
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hm = t => (t || '').slice(0, 5);
const money = v => `${Math.round(v)} сом`;
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const haptic = type => tg?.HapticFeedback?.notificationOccurred?.(type);
const tap = () => tg?.HapticFeedback?.impactOccurred?.('light');
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch { } } };

let toastTimer;
function toast(msg, ok = true) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  haptic(ok ? 'success' : 'error');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

function authHeaders() {
  const h = {};
  if (tg?.initData) h.Authorization = 'tma ' + tg.initData;
  else if (devUser) h['X-Dev-User'] = devUser;
  return h;
}

async function request(path, init) {
  const res = await fetch('/api/app' + path, init);
  if (res.status === 401 || res.status === 403) {
    const err = await res.json().catch(() => ({}));
    throw Object.assign(new Error(err.message || 'Нет доступа'), { code: err.error || 'forbidden' });
  }
  if (!res.ok) throw new Error('Ошибка сервера, попробуйте ещё раз');
  return res.json();
}

const api = (path, body) => request(path, {
  method: body === undefined ? 'GET' : 'POST',
  headers: { 'Content-Type': 'application/json', ...authHeaders() },
  body: body === undefined ? undefined : JSON.stringify(body),
});

async function act(path, body, after) {
  try {
    const r = await api(path, body);
    toast(r.message, r.ok);
    if (after) await after(r);
    return r;
  } catch (e) { toast(e.message, false); }
}

// Окна Telegram (showConfirm, showPopup) есть только внутри Telegram 6.2+. В браузере и старых клиентах они бросают
// WebAppMethodUnsupported и колбэк не вызывается — тогда используем обычные окна браузера.
const inTelegram = !!tg?.initData;
const tgPopups = inTelegram && !!tg.isVersionAtLeast?.('6.2');

function confirmBox(text) {
  return new Promise(res => {
    if (tgPopups) { try { return tg.showConfirm(text, res); } catch { } }
    res(confirm(text));
  });
}

/** Выбор из 2–3 вариантов: всплывающее окно Telegram, в браузере — prompt. Возвращает значение или null. */
function choose(title, options) {
  return new Promise(res => {
    if (tgPopups) {
      try {
        return tg.showPopup({ message: title, buttons: options.slice(0, 3).map(o => ({ id: String(o.value), type: 'default', text: o.text })) },
          id => res(id ? options.find(o => String(o.value) === id)?.value ?? null : null));
      } catch { }
    }
    const v = prompt(`${title} (${options.map(o => o.value).join(' / ')})`, options[0].value);
    res(v ? +v || v : null);
  });
}

// Кнопка «Назад» Telegram: один обработчик за раз.
function setBack(fn) {
  clearBack();
  S.back = fn;
  tg?.BackButton?.onClick(fn);
  tg?.BackButton?.show();
}
function clearBack() {
  if (S.back) tg?.BackButton?.offClick(S.back);
  S.back = null;
  tg?.BackButton?.hide();
}

// Часы: берём время сервера (поле serverNow в /me), чтобы сбитые часы телефона не ломали «через N минут».
function syncClock(me) { if (me?.serverNow) S.skew = new Date(me.serverNow) - Date.now(); }
const nowMs = () => Date.now() + (S.skew || 0);
const todayIso = () => { const d = new Date(nowMs()); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

// Минут до момента «дата + время» (отрицательное — уже прошло).
function minsTo(date, time) {
  return Math.round((new Date(`${date}T${hm(time) || '00:00'}:00`) - nowMs()) / 60000);
}
function fmtMins(m) { return m < 60 ? `${m} мин` : `${Math.floor(m / 60)} ч ${m % 60} мин`; }

// ───────── карта ─────────
function navUrl(kind, lat, lng) {
  return kind === '2gis' ? `https://2gis.kg/bishkek?m=${lng},${lat}/17`
    : `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=${kind === 'drive' ? 'driving' : 'walking'}`;
}
function openLink(url) { inTelegram && tg.openLink ? tg.openLink(url) : window.open(url, '_blank'); }
function bindNav(root) {
  root?.querySelectorAll('[data-nav]').forEach(b => b.onclick = e => { e.preventDefault(); openLink(navUrl(b.dataset.nav, b.dataset.lat, b.dataset.lng)); });
}
function stopNavHtml(st) {
  return `<div class="eyebrow">Точка сбора</div><div class="title">${esc(st.name)}</div>${st.note ? `<div class="hint">${esc(st.note)}</div>` : ''}
    <div class="g2" style="margin-top:10px">
      <button class="sm" data-nav="google" data-lat="${st.lat}" data-lng="${st.lng}">${IC.nav} Как дойти</button>
      <button class="sm" data-nav="2gis" data-lat="${st.lat}" data-lng="${st.lng}">Открыть в 2ГИС</button>
    </div>`;
}

/**
 * Рисует маршрут: линию и пронумерованные остановки. opts: selectedId, onSelect(id), badges {stopId: число} — счётчики на остановках,
 * view {center, zoom} — вернуть прежний вид (чтобы автообновление экрана не сбрасывало карту), onView(view) — запомнить вид.
 * Возвращает {select(stopId)} или null, если координат нет.
 */
function mountMap(el, stops, path, opts = {}) {
  const pts = stops.filter(s => s.lat != null && s.lng != null);
  if (!el || !pts.length || typeof L === 'undefined') return null;
  try { S.leaflet?.remove(); } catch { }
  const map = S.leaflet = L.map(el, { scrollWheelZoom: false });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);

  const line = path && path.length > 1 ? path : pts.map(s => [s.lat, s.lng]);
  L.polyline(line, { color: '#0F5F47', weight: 5, opacity: .85 }).addTo(map);

  const last = Math.max(...stops.map(s => s.order));
  const markers = new Map();
  for (const s of pts) {
    const badge = opts.badges?.[s.id];
    const icon = L.divIcon({
      className: '', iconSize: [30, 30], iconAnchor: [15, 15],
      html: `<div class="pin ${s.id === opts.selectedId ? 'sel' : ''} ${s.order === last ? 'office' : ''}">${s.order}${badge ? `<b>${badge}</b>` : ''}</div>`,
    });
    const mk = L.marker([s.lat, s.lng], { icon, title: s.name }).addTo(map).bindTooltip(esc(s.name), { direction: 'top', offset: [0, -16] });
    if (opts.onSelect) mk.on('click', () => opts.onSelect(s.id));
    markers.set(s.id, mk);
  }

  const bounds = L.latLngBounds([...line, ...pts.map(s => [s.lat, s.lng])]);
  const fit = () => {
    map.invalidateSize();
    if (opts.view) map.setView(opts.view.center, opts.view.zoom, { animate: false });
    else map.fitBounds(bounds, { padding: [28, 28], maxZoom: 16 });
  };
  fit(); setTimeout(fit, 150);
  if (opts.onView) map.on('moveend', () => opts.onView({ center: map.getCenter(), zoom: map.getZoom() }));

  return {
    select(sid) {
      markers.forEach((mk, id) => {
        mk.getElement()?.querySelector('.pin')?.classList.toggle('sel', id === sid);
        mk.setZIndexOffset(id === sid ? 1000 : 0);
      });
    },
  };
}

// ───────── схема салона ─────────
/** grid — ответ API: [[{type, number, state, who}]]. sel — выбранное место. wide — с подписями (водителю). */
function seatMapHtml(grid, sel, wide = false) {
  const cols = grid[0].length;
  const cells = grid.flat().map(c => {
    if (c.type === 'driver') return `<div class="seat wheel" title="Водитель">${IC.wheel}</div>`;
    if (c.type === 'empty') return `<div class="seat empty"></div>`;
    const pickable = c.state === 'free' || c.state === 'mine';
    const chosen = c.number === sel && pickable;
    const label = c.who ? esc(c.who) : chosen ? 'ваше' : c.state === 'free' ? 'свободно' : c.state === 'mine' ? 'было ваше' : 'занято';
    return `<div class="seat ${chosen ? 'sel' : c.state === 'mine' ? 'free' : c.state}" ${pickable ? `data-seat="${c.number}"` : ''}>${c.number}<small>${label}</small></div>`;
  }).join('');
  return `<div class="car" style="grid-template-columns:repeat(${cols},${wide ? 76 : 72}px)">${cells}</div>`;
}

/** Рисует карту в элемент и вешает выбор места. pick(number) вызывается при нажатии на свободное место. */
function drawSeatMap(el, grid, sel, pick, wide = false) {
  el.innerHTML = seatMapHtml(grid, sel, wide);
  el.querySelectorAll('[data-seat]').forEach(s => s.onclick = () => { tap(); pick(+s.dataset.seat); });
}

const seatCells = grid => grid.flat().filter(c => c.type === 'seat');
const pickableSeat = (grid, n) => seatCells(grid).some(c => c.number === n && (c.state === 'free' || c.state === 'mine'));

// ───────── старт ─────────
async function boot() {
  try {
    S.me = await api('/me');
    syncClock(S.me);
  } catch (e) {
    if (e.code === 'need_contact') return renderNeedContact();
    $view.innerHTML = `<div class="center" style="padding:40px 16px"><p>${esc(e.message)}</p></div>`;
    return;
  }
  renderTabs();
  const start = tg?.initDataUnsafe?.start_param;
  if (start && start.startsWith('board_')) await board(start);
  show(S.tab);
}

function renderNeedContact() {
  $view.innerHTML = `
    <div class="center" style="padding:40px 8px">
      <h1>Добро пожаловать</h1>
      <p class="hint">Поделитесь номером телефона — по нему водитель и приложение вас узнают.</p>
      <div class="spacer"></div>
      <button class="primary block" id="share">${IC.phone} Поделиться номером</button>
    </div>`;
  document.getElementById('share').onclick = () => {
    if (!inTelegram || !tg.requestContact) return toast('Отправьте номер в чате с ботом', false);
    tg.requestContact(async ok => {
      if (!ok) return;
      for (let i = 0; i < 6; i++) {           // бот регистрирует контакт асинхронно
        await new Promise(r => setTimeout(r, 1000));
        try { S.me = await api('/me'); renderTabs(); return show('today'); } catch { }
      }
      toast('Не получилось. Откройте чат с ботом и нажмите «Поделиться номером».', false);
    });
  };
}

function renderTabs() {
  // «Неделя» и «Оплата» на время пилота скрыты (код экранов оставлен): запись — только на сегодня.
  const tabs = [['today', IC.car, 'Сегодня'], ['routes', IC.route, 'Маршруты']];
  if (S.me.isDriver) tabs.push(['driver', IC.wheel, 'Водитель']);
  const el = document.getElementById('tabs');
  el.hidden = false;
  el.innerHTML = tabs.map(([id, ic, name]) => `<button data-tab="${id}">${ic}${name}</button>`).join('');
  el.onclick = e => { const b = e.target.closest('button'); if (b) { tap(); S.route = null; S.oneOff = null; S.step = 1; show(b.dataset.tab); } };
}

function show(tab) {
  S.tab = tab;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  clearBack();
  clearInterval(S.driverTimer);
  const dark = tab === 'driver';
  document.documentElement.classList.toggle('drv', dark);
  try { tg?.setHeaderColor?.(dark ? '#0E1512' : '#F3F4EF'); tg?.setBackgroundColor?.(dark ? '#0E1512' : '#F3F4EF'); } catch { }
  window.scrollTo(0, 0);
  ({ today: renderToday, week: renderWeek, routes: renderRoutes, pay: renderPay, driver: renderDriver })[tab]()
    .catch(e => { $view.innerHTML = `<div class="card">${esc(e.message)}</div>`; });
}

// ───────── посадка по QR ─────────
function scan() {
  if (inTelegram && tg.showScanQrPopup && tg.isVersionAtLeast?.('6.4')) {
    tg.showScanQrPopup({ text: 'Наведите камеру на QR-код в машине' }, text => {
      if (!/board_|^[0-9a-f]{6,32}$/i.test(text)) return false;   // не наш QR — продолжаем сканировать
      tg.closeScanQrPopup(); board(text); return true;
    });
  } else {
    const code = prompt('Введите код с наклейки в машине');
    if (code) board(code);
  }
}
async function board(code) {
  await act('/board', { code }, () => S.tab === 'today' && renderToday());
}

// ───────── Сегодня ─────────
async function renderToday() {
  const [me, trips] = await Promise.all([api('/me'), api('/trips')]);
  S.me = me;
  syncClock(me);
  const m = me.membership;
  const anchor = t => t.dir === 'Morning' ? t.time : (t.departure || t.time);
  // Актуальные поездки: не отменённые, не «не еду» и не закончившиеся (сегодняшний рейс прячем после прибытия или через 1,5 часа).
  const live = trips.filter(t => !t.isAbsent && !t.isCancelled && !(t.isToday && (t.arrived || minsTo(t.date, anchor(t)) < -90)));
  const next = live[0], after = live[1];
  const dayName = t => t.isToday ? 'Сегодня' : cap(t.label.split(',')[0]);

  const routeName = next?.route || m?.route;
  let html = `${routeName ? `<div class="eyebrow">${esc(routeName)}</div>` : ''}<h1>${next ? `${dayName(next)}${next.isToday ? '' : ' — ближайшая поездка'}` : 'Поездки'}</h1>`;

  if (next) {
    const morning = next.dir === 'Morning';
    const mins = minsTo(next.date, anchor(next));
    const boarded = next.result === 'Boarded';
    const badge = boarded ? 'Вы в машине' : next.departed ? 'Водитель выехал' : '';
    const sub = morning
      ? `${next.isToday && mins > 0 ? `через ${fmtMins(mins)}<br>` : ''}у вашей остановки`
      : `выезд от офиса${next.time ? `<br>дома ≈ ${hm(next.time)}` : ''}`;
    const more = [];
    if (morning && next.stopLat != null) more.push(`<button class="ghost" data-nav="google" data-lat="${next.stopLat}" data-lng="${next.stopLng}">Как дойти</button>`);
    if (next.isToday && !boarded) more.push(`<button class="ghost" id="late">Опаздываю</button>`);
    if (next.canChange) more.push(next.isRegular ? `<button class="ghost" id="skip">Не еду</button>` : `<button class="ghost" id="unbook">Отменить бронь</button>`);
    html += `<div class="hero">
      <div class="flex between"><span class="eyebrow">${morning ? 'Утро · в офис' : 'Вечер · домой'}${next.isRegular ? '' : ' · разово'}</span>${badge ? `<span class="chip warn">${badge}</span>` : ''}</div>
      <div class="flex end" style="gap:14px"><div class="clock">${hm(anchor(next))}</div><div class="sub">${sub}</div></div>
      <div class="g2">
        <div class="cell" style="grid-column:1/-1"><small>${morning ? 'Точка сбора' : 'Выходите'}</small><b>${esc(next.stop)}</b></div>
        <div class="cell"><small>Место</small><b>№ ${next.seat ?? '—'}</b></div>
        <div class="cell"><small>Поездка</small><b>${money(next.price)}</b></div>
      </div>
      ${next.isToday && !boarded ? `<button class="white block" id="scan">${IC.scan} Я в машине — отметиться</button>` : ''}
      ${more.length ? `<div class="${more.length > 1 ? 'g2' : 'g1'}">${more.join('')}</div>` : ''}
      ${next.stopNote && morning ? `<div class="note">${esc(next.stopNote)}</div>` : ''}
      ${next.canChange ? `<div class="note">${next.isToday && !next.isRegular ? 'Отменить можно не позже чем за 10 минут до посадки.' : 'Отменить бесплатно можно до 21:00 накануне.'}</div>` : ''}
    </div>`;
    if (next.driver) html += `<div class="card flex" style="gap:12px">
      <div class="avatar">${esc(next.driver[0])}</div>
      <div class="grow"><div class="title">${esc(next.driver)}</div><div class="hint">${esc(next.car)}</div></div>
      ${next.driverPhone ? `<a class="avatar" style="background:var(--bg2);color:var(--text)" href="tel:+${esc(next.driverPhone)}" aria-label="Позвонить водителю">${IC.phone}</a>` : ''}
    </div>`;
    if (after) html += `<div class="card flex" style="gap:12px">
      <div class="grow"><div class="title">${after.isToday ? '' : dayName(after) + ' · '}${after.dir === 'Morning' ? 'Утром в офис' : 'Вечером домой'} · ${hm(anchor(after))}</div>
        <div class="hint">${after.dir === 'Morning' ? esc(after.stop) : 'от офиса'} · место № ${after.seat ?? '—'}</div></div>
      ${after.canChange && after.isRegular ? `<button class="sm" id="skip2">Не еду</button>` : `<span class="chip ok">Еду</span>`}
    </div>`;
  } else if (!m) {
    html += `<div class="card"><div class="title">Поехать сегодня</div>
      <div class="hint">Выберите маршрут, точку сбора и место в машине. Утром записываем на утро и вечер, днём — на вечер. Платите только за состоявшиеся поездки.</div>
      <div class="spacer"></div><button class="primary block" data-go="routes">Выбрать маршрут</button></div>`;
  } else if (m.status === 'Waitlist') {
    html += `<div class="card"><div class="flex between"><div class="title">${esc(m.route)}</div><span class="chip warn">в очереди</span></div>
      <div class="hint">Мест пока нет. Сообщим, как только место освободится или появится вторая машина.</div>
      <div class="spacer"></div><button class="primary block" id="toSurvey">Ответить на 4 вопроса</button>
      <div class="hint" style="margin-top:8px">Ответы помогают решить, когда и откуда запускать следующую машину.</div></div>`;
  } else {
    html += `<div class="card"><div class="title">Ближайших поездок нет</div>
      <div class="hint">Все ближайшие поездки отменены или отмечены «не еду».</div>
      <div class="spacer"></div><button class="primary block" data-go="routes">Записаться на сегодня</button></div>`;
  }
  if (me.due > 0) html += `<div class="card flex between"><span class="hint" style="font-weight:600">К оплате</span><b style="font-size:16px">${money(me.due)}</b></div>`;

  $view.innerHTML = html;
  bindNav($view);
  const on = (id, fn) => document.getElementById(id)?.addEventListener('click', fn);
  on('scan', scan);
  on('late', async () => { const n = await choose('На сколько минут опаздываете?', [{ value: 2, text: '2 мин' }, { value: 5, text: '5 мин' }]); if (n) act('/late', { date: next.date, dir: next.dir, minutes: n }); });
  on('skip', async () => { if (await confirmBox(`Не едете ${next.label}? Место освободится для других.`)) act('/absence', { date: next.date, dir: next.dir }, renderToday); });
  on('unbook', async () => { if (await confirmBox('Отменить разовую поездку?')) act('/oneoff/cancel', { bookingId: next.bookingId }, renderToday); });
  on('skip2', async () => { if (await confirmBox(`Не едете ${after.label}?`)) act('/absence', { date: after.date, dir: after.dir }, renderToday); });
  on('toSurvey', () => renderSurvey(m.routeId, m.route));
  $view.querySelectorAll('[data-go]').forEach(b => b.onclick = e => { e.preventDefault(); show(b.dataset.go); });
}

// ───────── Неделя ─────────
async function renderWeek() {
  const w = await api('/week');
  if (!w.routeId) { $view.innerHTML = `<h1>Неделя</h1><div class="card hint">Пока нет активных маршрутов.</div>`; return; }

  const cell = (c, i, j) => {
    const t = hm(c.dir === 'Morning' ? (c.time || c.departure) : c.departure);
    const at = `data-i="${i}" data-j="${j}"`;
    if (!c.runs) return `<div class="wk off">${c.isCancelled ? 'Рейс отменён' : 'Нет рейса'}</div>`;
    if (c.mine) {
      if (c.result === 'Boarded') return `<div class="wk done">Поездка<small>${t} · отмечена</small></div>`;
      if (c.result === 'NoShow') return `<div class="wk bad">Неявка<small>${t}</small></div>`;
      if (c.isAbsent) return c.canChange ? `<button class="wk absent" data-act="back" ${at}>Не еду<small>нажмите, чтобы вернуть</small></button>` : `<div class="wk absent">Не еду<small>${t}</small></div>`;
      const sub = `${t} · ${c.isRegular ? `место № ${c.seat ?? '—'}` : 'разово'}`;
      return c.canChange ? `<button class="wk on" data-act="${c.isRegular ? 'skip' : 'unbook'}" ${at}>Еду<small>${sub}</small></button>` : `<div class="wk on">Еду<small>${sub}</small></div>`;
    }
    if (c.free > 0 && c.canChange) return `<button class="wk add" data-act="add" ${at}>+ Поехать<small>${t} · свободно ${c.free}</small></button>`;
    return `<div class="wk off">${c.free > 0 ? 'Запись закрыта' : 'Мест нет'}<small>${t}</small></div>`;
  };
  const rides = w.days.flatMap(d => d.cells).filter(c => c.runs && c.mine && !c.isAbsent && c.result !== 'NoShow').length;

  $view.innerHTML = `<div class="eyebrow">${esc(w.route)}</div><h1>Неделя</h1>
    <div class="wkrow wkhead"><span></span><span>Утро · в офис</span><span>Вечер · домой</span></div>
    ${w.days.map((d, i) => `<div class="wkrow">
      <div><div style="font-size:16px;font-weight:800">${cap(esc(d.label.split(' ')[0]))}</div><div class="hint" style="font-weight:600;${d.isToday ? 'color:var(--accent)' : ''}">${d.isToday ? 'сегодня' : esc(d.label.split(' ')[1] || '')}</div></div>
      ${d.cells.map((c, j) => cell(c, i, j)).join('')}</div>`).join('')}
    <div class="card flex between" style="margin-top:12px">
      <div><div class="title" style="font-weight:800">Поездок: ${rides}</div><div class="hint">Изменения на завтра — до 21:00</div></div>
      <div style="font-size:20px;font-weight:800">${money(rides * w.price)}</div>
    </div>
    <div class="hint" style="padding:0 4px">Нажмите на поездку, чтобы отменить её или вернуть. Свободное место в другой день можно занять разово.</div>`;

  $view.querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
    tap();
    const d = w.days[b.dataset.i], c = d.cells[b.dataset.j], ref = { date: d.date, dir: c.dir };
    const what = `${d.label}, ${c.dir === 'Morning' ? 'утро' : 'вечер'}`;
    if (b.dataset.act === 'skip') { if (await confirmBox(`Не едете ${what}? Место освободится для других.`)) act('/absence', ref, renderWeek); }
    else if (b.dataset.act === 'back') act('/absence/remove', ref, renderWeek);
    else if (b.dataset.act === 'unbook') { if (await confirmBox(`Отменить разовую поездку ${what}?`)) act('/oneoff/cancel', { bookingId: c.bookingId }, renderWeek); }
    else { S.route = w.routeId; S.oneOff = { ...ref, from: 'week' }; S.seat1 = null; show('routes'); }
  });
}

// ───────── Маршруты ─────────
async function renderRoutes() {
  S.routes = await api('/routes');
  if (S.route) return renderRoute(S.route);
  const m = S.me.membership;
  $view.innerHTML = `<h1>Маршруты</h1>` + (S.routes.length ? S.routes.map(r => {
    const free = Math.min(r.freeMorning, r.freeEvening);
    const mine = m && m.routeId === r.id;
    return `<button class="card" data-route="${r.id}" style="display:block;width:100%;text-align:left;font-weight:500;min-height:0;padding:16px">
      <div class="flex between"><div style="font-size:18px;font-weight:800">${esc(r.name)}</div>
        ${mine ? `<span class="chip ok">${m.status === 'Waitlist' ? 'вы в очереди' : 'ваш маршрут'}</span>` : `<span class="chip ${free ? 'ok' : 'warn'}">${free ? `свободно ${free} из ${r.seats}` : 'мест нет'}</span>`}</div>
      <div class="hint" style="margin:6px 0 10px">${r.stops.map(s => esc(s.name)).join(' → ')}</div>
      <div class="flex between"><span class="hint">${r.stops[0] ? `Выезд ${hm(r.stops[0].morning)} · ` : ''}${esc(r.car)}</span><b style="white-space:nowrap">${money(r.price)} / поездка</b></div>
    </button>`;
  }).join('') + `<div class="hint" style="padding:0 4px">Новые маршруты открываем, когда в районе набирается машина желающих.</div>`
    : `<div class="card hint">Пока нет активных маршрутов.</div>`);
  $view.querySelectorAll('[data-route]').forEach(el => el.onclick = () => { tap(); S.step = 1; renderRoute(+el.dataset.route); });
}

function backToRoutes() { S.route = null; S.oneOff = null; S.step = 1; clearBack(); if (S.tab === 'routes') renderRoutes(); }
function backToRoute() { const from = S.oneOff?.from; S.oneOff = null; if (from === 'week') { S.route = null; show('week'); } else renderRoute(S.route); }

async function renderRoute(id) {
  S.route = id;
  if (!S.routes) S.routes = await api('/routes');
  if (S.oneOff) return renderOneOff(id);

  const r = S.routes.find(x => x.id === id);
  if (!r) return backToRoutes();
  const m = S.me.membership;
  const mine = m && m.routeId === id && m.status === 'Regular' ? m : null;
  const queued = m && m.routeId === id && m.status === 'Waitlist';
  if (mine) S.dirs = mine.morning && mine.evening ? 'both' : mine.morning ? 'morning' : 'evening';
  if (!S.stopId || !r.stops.some(s => s.id === S.stopId)) S.stopId = mine ? mine.stopId : r.stops[0]?.id;
  // Новые пассажиры записываются только на сегодня; экран постоянной записи — для тех, кто уже ездит постоянно.
  if (!mine) return renderRouteToday(r);

  const sm = await api(`/routes/${id}/seats?morning=${S.dirs !== 'evening'}&evening=${S.dirs !== 'morning'}`);
  if (!pickableSeat(sm.layout, S.seat)) S.seat = sm.mySeat ?? seatCells(sm.layout).find(c => c.state === 'free')?.number ?? null;
  const hasFree = sm.free > 0 || !!mine;
  if (S.step === 2 && !hasFree) S.step = 1;
  const stop = () => r.stops.find(s => s.id === S.stopId);
  const dirsText = { both: 'туда и обратно', morning: 'только утро', evening: 'только вечер' };
  const join = seat => act('/membership', { routeId: id, stopId: S.stopId, morning: S.dirs !== 'evening', evening: S.dirs !== 'morning', seat },
    async res => { if (!res.ok) return; S.me = await api('/me'); S.step = 1; if (seat == null) renderSurvey(id, r.name); else { S.route = null; show('today'); } });

  if (S.step === 2) {
    setBack(() => { S.step = 1; renderRoute(id); });
    $view.innerHTML = `
      <div class="steps g2"><i class="on"></i><i class="on"></i></div>
      <div class="eyebrow">Шаг 2 из 2 · ${esc(r.car)}</div><h1>${mine ? 'Ваше место' : 'Выберите своё место'}</h1>
      <div class="card">
        ${sm.photo ? `<img class="photo" src="${esc(sm.photo)}" alt="Салон" />` : ''}
        <div id="map"></div>
      </div>
      <div class="list">
        <div class="row"><span class="hint grow">Посадка</span><b>${esc(stop().name)} · ${hm(stop().morning)}</b></div>
        <div class="row"><span class="hint grow">Когда</span><b>Пн–Пт · ${dirsText[S.dirs]}</b></div>
        <div class="row"><span class="hint grow">Цена</span><b>${money(r.price)} за поездку</b></div>
      </div>
      <div class="hint flex" style="align-items:flex-start;padding:0 4px 6px">${IC.check}<span>Не едете — отметьте до 21:00 накануне, это бесплатно</span></div>
      <div class="hint flex" style="align-items:flex-start;padding:0 4px 12px">${IC.check}<span>Оплата раз в неделю, по пятницам — переводом или наличными водителю</span></div>
      <button class="primary block" id="join"></button>
      ${mine ? `<div class="spacer"></div><button class="block danger line" id="leave">Отписаться от маршрута</button>` : ''}`;
    const btn = document.getElementById('join');
    const refresh = () => {
      drawSeatMap(document.getElementById('map'), sm.layout, S.seat, n => { S.seat = n; refresh(); });
      const unchanged = mine && S.seat === mine.seat && S.stopId === mine.stopId;
      btn.disabled = S.seat == null || unchanged;
      btn.textContent = mine ? (unchanged ? `Место № ${S.seat} — ваше` : `Сохранить: место № ${S.seat}`) : S.seat == null ? 'Выберите место на схеме' : `Закрепить место № ${S.seat}`;
    };
    refresh();
    btn.onclick = () => mine
      ? act('/membership/seat', { seat: S.seat, stopId: S.stopId }, async res => { if (res.ok) { S.me = await api('/me'); S.step = 1; renderRoute(id); } })
      : join(S.seat);
    document.getElementById('leave')?.addEventListener('click', async () => {
      if (await confirmBox('Перестать ездить постоянно? Место освободится для других.'))
        act('/membership/leave', {}, async () => { S.me = await api('/me'); backToRoutes(); });
    });
    return;
  }

  // Шаг 1: карта, остановка, направления.
  setBack(backToRoutes);
  const hasMap = r.stops.some(s => s.lat != null && s.lng != null);
  $view.innerHTML = `
    <div class="steps g2"><i class="on"></i><i></i></div>
    <div class="eyebrow">${esc(r.name)} · ${money(r.price)} за поездку</div><h1>${mine ? 'Ваша остановка' : 'Где вас забирать?'}</h1>
    ${hasMap ? `<div class="map" id="routeMap"></div>` : ''}
    <div class="list" id="stops"></div>
    <div class="card" id="stopInfo" hidden></div>
    <h2>Когда ездите?</h2>
    <div class="seg" id="dirs">
      <button data-d="both" ${mine ? 'disabled' : ''}>Туда и обратно</button><button data-d="morning" ${mine ? 'disabled' : ''}>Только утро</button><button data-d="evening" ${mine ? 'disabled' : ''}>Только вечер</button>
    </div>
    <div class="hint" style="padding:0 4px 12px">${mine ? 'Чтобы сменить направления, отпишитесь и запишитесь заново.' : `Каждый рабочий день. Отдельные дни отменяются на вкладке «Неделя».`}</div>
    ${queued ? `<div class="card"><span class="chip warn">вы в очереди</span><div class="hint" style="margin-top:6px">Сообщим, когда освободится место.</div></div>` : ''}
    <button class="primary block" id="next" ${queued ? 'disabled' : ''}>${hasFree ? 'Дальше — выбрать место' : queued ? 'Вы уже в очереди' : 'Мест нет — встать в очередь'}</button>`;

  mountStopPicker(r);
  $view.querySelectorAll('#dirs button').forEach(b => { b.classList.toggle('active', b.dataset.d === S.dirs); b.onclick = () => { tap(); S.dirs = b.dataset.d; renderRoute(id); }; });
  document.getElementById('next').onclick = () => { if (hasFree) { S.step = 2; window.scrollTo(0, 0); renderRoute(id); } else join(null); };
}

/**
 * Карта, список остановок и карточка «Точка сбора» с кнопками «Как дойти». Нужны элементы #stops, #stopInfo и (если есть координаты) #routeMap.
 * Остановку выбирают списком или нажатием на метку; экран при этом не перерисовывается целиком. onChange(stopId) — после выбора.
 */
function mountStopPicker(r, onChange) {
  const hasMap = r.stops.some(s => s.lat != null && s.lng != null);
  const stop = () => r.stops.find(s => s.id === S.stopId);
  let mapCtl = null;
  const drawStops = () => {
    const last = Math.max(...r.stops.map(s => s.order));
    document.getElementById('stops').innerHTML = r.stops.map(s => s.order === last
      ? `<div class="row"><span class="grow hint" style="font-weight:600;font-size:15px">${esc(s.name)} — приезжаем</span><b class="hint">≈ ${hm(s.morning)}</b></div>`
      : `<div class="row ${s.id === S.stopId ? 'sel' : ''}" data-stop="${s.id}" style="cursor:pointer">
        <div class="radio ${s.id === S.stopId ? 'on' : ''}"></div>
        <div class="grow"><div class="title">${esc(s.name)}</div>${s.note ? `<div class="hint">${esc(s.note)}</div>` : ''}</div>
        <div style="text-align:right"><b>${hm(s.morning)}</b><div class="hint">домой ${hm(s.evening)}</div></div></div>`).join('');
    document.querySelectorAll('#stops [data-stop]').forEach(el => el.onclick = () => { tap(); pickStop(+el.dataset.stop); });
    const st = stop();
    const info = document.getElementById('stopInfo');
    info.hidden = !(st && st.lat != null && st.lng != null);
    if (!info.hidden) { info.innerHTML = stopNavHtml(st); bindNav(info); }
  };
  const pickStop = sid => { S.stopId = sid; mapCtl?.select(sid); drawStops(); onChange?.(sid); };
  drawStops();
  if (hasMap) mapCtl = mountMap(document.getElementById('routeMap'), r.stops, r.path, { selectedId: S.stopId, onSelect: sid => { tap(); pickStop(sid); } });
}

// ───────── Запись на сегодня ─────────
// Шаг 1: точка сбора и какие сегодняшние рейсы ещё открыты (утром — утро и вечер, днём — вечер). Шаг 2: место.
async function renderRouteToday(r) {
  const id = r.id;
  const last = Math.max(...r.stops.map(s => s.order));
  if (r.stops.find(s => s.id === S.stopId)?.order === last) S.stopId = r.stops.find(s => s.order !== last)?.id;
  const dirName = d => d === 'Morning' ? 'Утро · в офис' : 'Вечер · домой';
  const when = t => t.dir === 'Morning' ? `посадка ${hm(t.board)}` : `выезд ${hm(t.board)}`;

  if (S.step === 2 && S.today) {
    const td = S.today, open = td.trips.filter(t => t.open);
    setBack(() => { S.step = 1; renderRouteToday(r); });
    if (!pickableSeat(td.layout, S.seat)) S.seat = seatCells(td.layout).find(c => c.state === 'free')?.number ?? null;
    const st = r.stops.find(s => s.id === S.stopId);
    $view.innerHTML = `
      <div class="steps g2"><i class="on"></i><i class="on"></i></div>
      <div class="eyebrow">Шаг 2 из 2 · ${esc(r.car)}</div><h1>Выберите место</h1>
      <div class="card">
        ${td.photo ? `<img class="photo" src="${esc(td.photo)}" alt="Салон" />` : ''}
        <div id="map"></div>
      </div>
      <div class="list">
        <div class="row"><span class="hint grow">Точка сбора</span><b>${esc(st.name)}</b></div>
        ${open.map(t => `<div class="row"><span class="hint grow">${dirName(t.dir)}</span><b>сегодня, ${when(t)}</b></div>`).join('')}
        <div class="row"><span class="hint grow">Цена</span><b>${money(r.price)} за поездку</b></div>
      </div>
      <div class="hint flex" style="align-items:flex-start;padding:0 4px 12px">${IC.check}<span>Напомним за 30 и за 10 минут до выезда машины</span></div>
      <button class="primary block" id="book"></button>`;
    const btn = document.getElementById('book');
    const refresh = () => {
      drawSeatMap(document.getElementById('map'), td.layout, S.seat, n => { S.seat = n; refresh(); });
      btn.disabled = S.seat == null;
      btn.textContent = S.seat == null ? 'Свободных мест нет' : `Записаться на сегодня · место № ${S.seat}`;
    };
    refresh();
    btn.onclick = () => act('/today/book', { routeId: id, stopId: S.stopId, seat: S.seat }, async res => {
      if (res.ok) { S.me = await api('/me'); S.step = 1; S.today = null; S.route = null; show('today'); }
      else { S.step = 1; renderRouteToday(r); }
    });
    return;
  }

  S.step = 1;
  setBack(backToRoutes);
  const hasMap = r.stops.some(s => s.lat != null && s.lng != null);
  $view.innerHTML = `
    <div class="steps g2"><i class="on"></i><i></i></div>
    <div class="eyebrow">${esc(r.name)} · ${money(r.price)} за поездку</div><h1>Где вас забирать?</h1>
    ${hasMap ? `<div class="map" id="routeMap"></div>` : ''}
    <div class="list" id="stops"></div>
    <div class="card" id="stopInfo" hidden></div>
    <div class="card" id="todayBox"><div class="hint">Загрузка…</div></div>`;

  const loadToday = async () => {
    const box = document.getElementById('todayBox');
    const td = S.today = await api(`/routes/${id}/today?stopId=${S.stopId}`);
    if (!document.body.contains(box)) return;
    const open = td.trips.filter(t => t.open);
    if (!td.trips.length) {
      box.innerHTML = `<div class="title">Сегодня рейсов нет</div><div class="hint">Запись откроется в рабочий день.</div>`;
    } else if (!open.length) {
      const mine = td.trips.some(t => t.mine);
      box.innerHTML = mine
        ? `<div class="title">Вы уже записаны на сегодня</div><div class="spacer"></div><button class="primary block" data-go="today">Моя поездка</button>`
        : `<div class="title">На сегодня запись закрыта</div><div class="hint">Записаться можно не позже чем за 10 минут до посадки. Приходите завтра утром.</div>`;
    } else {
      box.innerHTML = `<div class="title">Поехать сегодня</div>
        <div class="list" style="margin:8px 0">${open.map(t => `<div class="row"><span class="grow">${dirName(t.dir)}</span><b>${when(t)}</b></div>`).join('')}</div>
        ${td.trips.some(t => t.mine) ? `<div class="hint" style="margin-bottom:8px">На ${td.trips.find(t => t.mine).dir === 'Morning' ? 'утро' : 'вечер'} вы уже записаны.</div>` : ''}
        <button class="primary block" id="next" ${td.free ? '' : 'disabled'}>${td.free ? 'Дальше — выбрать место' : 'Мест нет'}</button>`;
      document.getElementById('next')?.addEventListener('click', () => { tap(); S.step = 2; window.scrollTo(0, 0); renderRouteToday(r); });
    }
    box.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { S.route = null; show(b.dataset.go); });
  };
  mountStopPicker(r, () => loadToday().catch(e => toast(e.message, false)));
  await loadToday();
}

// ───────── Водитель ─────────
function driverHead(routes, d) {
  return (routes.length > 1 ? `<div class="seg">${routes.map(r => `<button data-r="${r.id}" class="${r.id === d.routeId ? 'active' : ''}">${esc(r.name)}</button>`).join('')}</div>` : '')
    + `<div class="seg"><button data-view="trip" class="${d.view !== 'car' ? 'active' : ''}">Рейс</button><button data-view="car" class="${d.view === 'car' ? 'active' : ''}">Машина и QR</button></div>`;
}
function bindDriverHead(d) {
  $view.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { d.routeId = +b.dataset.r; d.mapView = null; d.step = 0; renderDriver(); });
  $view.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { tap(); d.view = b.dataset.view; renderDriver(); });
}
const firstName = n => String(n || '').split(' ')[0];

async function renderDriver() {
  const routes = await api('/driver/routes');
  if (!routes.length) { $view.innerHTML = `<div class="card hint">За вами не закреплена машина. Обратитесь к администратору.</div>`; return; }
  const d = S.driver;
  if (!routes.some(r => r.id === d.routeId)) d.routeId = routes[0].id;
  if (d.view === 'car') { clearInterval(S.driverTimer); return renderDriverCar(routes); }

  const q = new URLSearchParams({ routeId: d.routeId });
  if (d.date) q.set('date', d.date);
  if (d.dir) q.set('dir', d.dir);
  const t = await api('/driver/trip?' + q);
  d.date = t.date; d.dir = t.dir;
  const ref = { routeId: d.routeId, date: d.date, dir: d.dir };
  const morning = t.dir === 'Morning';
  const riding = t.passengers.filter(p => !p.isAbsent);
  const absent = t.passengers.filter(p => p.isAbsent);
  const boarded = riding.filter(p => p.result === 'Boarded');
  // Остановки в порядке движения: утром по порядку, вечером в обратном.
  const stops = morning ? t.map.stops : [...t.map.stops].reverse();
  const hasMap = t.map.stops.some(s => s.lat != null && s.lng != null);
  const runs = t.isWorkday && !t.isCancelled;
  const mode = !runs ? 'off' : d.overview || !t.isToday ? 'list' : t.arrivedAt ? 'done' : t.departed ? 'run' : 'before';

  const shift = n => { const x = new Date(d.date + 'T12:00:00'); x.setDate(x.getDate() + n); d.date = x.toISOString().slice(0, 10); d.overview = false; renderDriver(); };
  let html = '';
  if (mode !== 'run') {
    html += driverHead(routes, d) + `<div class="card">
      <div class="flex between"><button class="sm round" id="prev" aria-label="Предыдущий день">${IC.left}</button>
        <div class="center"><div class="title" style="font-weight:800">${cap(esc(t.label.split(',')[0]))}${t.isToday ? ' · сегодня' : ''}</div>
          <div class="hint">${esc(t.route)}${t.departure ? ' · выезд ' + hm(t.departure) : ''}</div></div>
        <button class="sm round" id="next" aria-label="Следующий день">${IC.right}</button></div>
      <div class="spacer"></div>
      <div class="seg" id="dir" style="margin:0;background:var(--bg2)"><button data-d="Morning">Утро</button><button data-d="Evening">Вечер</button></div>
    </div>`;
  }

  const markBtns = p => p.result === 'Boarded'
    ? `<div class="flex between"><span class="flex" style="color:var(--ok);font-weight:800">${IC.check} В машине</span><button class="sm line danger" data-m="${p.userId}" data-res="NoShow">Не пришёл</button></div>`
    : p.result === 'NoShow'
      ? `<div class="flex between"><span style="color:var(--danger);font-weight:800">Не пришёл</span><button class="sm line" data-m="${p.userId}" data-res="Boarded">Всё-таки сел</button></div>`
      : `<div style="display:grid;grid-template-columns:2fr 1fr;gap:8px"><button class="primary xl" data-m="${p.userId}" data-res="Boarded">Сел</button>
           <button class="line danger xl" style="font-size:15px" data-m="${p.userId}" data-res="NoShow">Не пришёл</button></div>`;
  const paxCard = p => `<div class="card"><div class="flex" style="gap:12px;margin-bottom:12px">
      <div class="seatno">${p.seat ?? '–'}</div>
      <div class="grow"><div style="font-size:20px;font-weight:800">${esc(p.name)}</div>
        <div class="hint">${p.isRegular ? '' : 'разово · '}${esc(p.stop)}${p.due > 0 ? ` · долг ${money(p.due)}` : ''}</div></div>
      <a class="avatar" style="background:none;border:1.5px solid var(--hint);color:var(--text);width:52px;height:52px" href="tel:+${esc(p.phone)}" aria-label="Позвонить">${IC.phone}</a>
    </div>${markBtns(p)}</div>`;

  if (mode === 'off') {
    html += !t.isWorkday ? `<div class="card hint">Выходной — рейса нет.</div>`
      : `<div class="card"><span class="chip bad">Рейс отменён</span> <span class="hint">${esc(t.reason)}</span></div>`;
  } else if (mode === 'before') {
    html += `<div class="flex end" style="gap:14px;margin:4px 4px 14px"><div class="count">${riding.length}<span> / ${t.capacity}</span></div>
        <div class="hint" style="font-size:16px;font-weight:700;padding-bottom:8px">${riding.length === 1 ? 'пассажир едет' : 'пассажиров едут'}<br>${morning ? 'в офис' : 'домой'}</div></div>
      ${absent.length ? `<div class="alert">Не ${absent.length > 1 ? 'едут' : 'едет'}: ${absent.map(p => esc(firstName(p.name))).join(', ')}</div>` : ''}
      <div class="list">${stops.map(s => {
        const names = riding.filter(p => p.stopId === s.id).map(p => esc(firstName(p.name)));
        const office = s.order === Math.max(...t.map.stops.map(x => x.order));
        return `<div class="row" style="min-height:64px${names.length || office ? '' : ';opacity:.55'}">
          <div class="tm">${hm(s.time)}</div>
          <div class="grow"><div class="title" style="font-size:16px;font-weight:800">${esc(s.name)}</div>
            <div class="hint">${office ? (morning ? 'приезжаем' : 'все садятся здесь') : names.length ? names.join(', ') : 'никого — можно не заезжать'}</div></div>
          ${office ? '' : `<div class="num ${names.length ? '' : 'zero'}">${names.length}</div>`}</div>`;
      }).join('')}</div>
      ${hasMap ? `<div class="map" id="tripMap"></div>` : ''}
      <div class="g2" style="margin-bottom:12px"><button class="line" id="delay">Задерживаюсь</button><button class="line danger" id="cancel">Отменить рейс</button></div>
      <div class="hint center" style="margin-bottom:8px">Пассажиры получат сообщение «Водитель выехал»</div>
      <button class="primary block xl" id="depart" style="min-height:72px;font-size:22px">Выехал</button>
      <div class="spacer"></div><button class="block" id="toList" style="background:transparent;color:var(--hint);font-size:14px">Список пассажиров и схема салона</button>`;
  } else if (mode === 'run') {
    // Один экран — одна остановка. Утром идём по остановкам, где кто-то садится; вечером все садятся у офиса.
    const steps = morning ? stops.filter(s => riding.some(p => p.stopId === s.id)).map(s => ({ stop: s, pax: riding.filter(p => p.stopId === s.id) }))
      : [{ stop: stops[0], pax: riding }];
    if (!steps.length) steps.push({ stop: stops[0], pax: [] });
    d.step = Math.min(Math.max(0, d.step), steps.length - 1);
    const st = steps[d.step], last = d.step === steps.length - 1;
    const late = t.isToday ? -minsTo(t.date, st.stop.time) : 0;
    html += `<div class="steps" style="grid-template-columns:repeat(${steps.length},minmax(0,1fr))">${steps.map((_, i) => `<i class="${i <= d.step ? 'on' : ''}"></i>`).join('')}</div>
      <div class="flex between hint" style="font-weight:700;margin-bottom:8px"><span>Остановка ${d.step + 1} из ${steps.length} · в машине ${boarded.length}</span>
        ${late > 1 && late < 90 ? `<span class="chip warn">+${late} мин к графику</span>` : ''}</div>
      <div class="flex between end" style="margin-bottom:12px"><h1 style="margin:0;font-size:30px">${esc(st.stop.name)}</h1><div style="font-size:30px;font-weight:800;color:var(--hint);line-height:1.15">${hm(st.stop.time)}</div></div>
      ${st.stop.lat != null ? `<button class="line block" style="margin-bottom:12px" data-nav="drive" data-lat="${st.stop.lat}" data-lng="${st.stop.lng}">${IC.nav} Открыть в навигаторе</button>` : ''}
      ${st.pax.length ? st.pax.map(paxCard).join('') : `<div class="card hint">На этой остановке никого.</div>`}
      <div style="display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px;margin-top:4px">
        <button class="line xl" id="showQr" aria-label="Показать QR для посадки" style="min-height:72px">${IC.qr}</button>
        <button class="xl" id="go" style="min-height:72px;background:var(--text);color:var(--bg2)">${last ? (morning ? 'Приехали в офис' : 'Рейс завершён') : 'Едем дальше'}</button>
      </div>
      <div class="flex between" style="margin-top:10px">
        ${d.step > 0 ? `<button class="sm" id="backStep" style="background:transparent;color:var(--hint)">${IC.left} Назад</button>` : '<span></span>'}
        <button class="sm" id="toList" style="background:transparent;color:var(--hint)">Весь список</button></div>`;
  } else if (mode === 'done') {
    const noShows = riding.filter(p => p.result === 'NoShow').length;
    const debtors = t.passengers.filter(p => p.due > 0);
    html += `<div class="eyebrow" style="color:var(--ok);font-weight:700">Рейс завершён</div><h1 style="font-size:30px">Приехали в ${t.arrivedAt.slice(11, 16)}</h1>
      <div class="g3" style="margin-bottom:12px">
        <div class="stat"><b>${boarded.length}</b><span class="hint">доехали</span></div>
        <div class="stat"><b>${noShows}</b><span class="hint">не пришли</span></div>
        <div class="stat"><b>${Math.round(boarded.length * t.price)}</b><span class="hint">сом за рейс</span></div>
      </div>
      ${riding.some(p => !p.result) ? `<div class="alert">Без отметки: ${riding.filter(p => !p.result).map(p => esc(firstName(p.name))).join(', ')}. Поездка без отметки не оплачивается.</div>` : ''}
      <h2>Отдали наличные?</h2>
      <div class="list">${debtors.length ? debtors.map(p => `<div class="row" style="min-height:68px">
          <div class="grow"><div style="font-size:17px;font-weight:800">${esc(firstName(p.name))} · ${money(p.due)}</div><div class="hint">долг за поездки</div></div>
          <button class="primary" data-paid="${p.userId}" data-sum="${p.due}" data-name="${esc(firstName(p.name))}">Получил</button></div>`).join('')
        : `<div class="row hint">Долгов нет.</div>`}</div>
      <button class="block line" id="toList">Изменить отметки</button>`;
  } else {
    // Список: прошлые и будущие дни, ручные отметки, схема салона.
    if (hasMap) html += `<div class="map" id="tripMap"></div>`;
    html += `<div class="card" id="seats"></div>
      <div class="flex between" style="margin:14px 4px 8px"><h2 style="margin:0">Пассажиры</h2><span class="hint">едут ${t.occupied}/${t.capacity}${t.canMark ? ` · сели ${boarded.length}` : ''}</span></div>
      <div class="list">${t.passengers.length ? t.passengers.map(p => `<div class="row ${p.isAbsent ? 'muted' : ''}">
          <div class="grow"><div class="title">${p.seat != null ? `<span class="chip">№${p.seat}</span> ` : ''}${esc(p.name)}${p.isRegular ? '' : ' <span class="chip warn">разово</span>'}</div>
            <div class="hint">${hm(p.time)} · ${esc(p.stop)} · <a href="tel:+${esc(p.phone)}">+${esc(p.phone)}</a></div></div>
          ${p.isAbsent ? `<span class="chip">не едет</span>` : !t.canMark ? '' : `
            <button class="sm round ${p.result === 'Boarded' ? 'primary' : ''}" data-m="${p.userId}" data-res="Boarded" aria-label="Сел">${IC.check}</button>
            <button class="sm round" style="${p.result === 'NoShow' ? 'background:var(--danger);color:var(--bg2)' : ''}" data-m="${p.userId}" data-res="NoShow" aria-label="Не пришёл">✕</button>`}
        </div>`).join('') : `<div class="row hint">Пассажиров нет.</div>`}</div>
      ${t.isToday ? `<button class="primary block" id="backTrip">Вернуться к рейсу</button><div class="spacer"></div>` : ''}
      ${t.date >= todayIso() ? `<button class="block line danger" id="cancel">Отменить рейс</button>` : ''}`;
  }

  $view.innerHTML = html;
  bindDriverHead(d);
  bindNav($view);
  const seats = document.getElementById('seats');
  if (seats) drawSeatMap(seats, t.layout, null, () => { }, true);
  const tripMap = document.getElementById('tripMap');
  if (tripMap) {
    // Автообновление перерисовывает экран — запоминаем, куда водитель сдвинул карту, и возвращаем тот же вид.
    mountMap(tripMap, t.map.stops, t.map.path, {
      badges: Object.fromEntries(t.map.stops.map(s => [s.id, s.passengers])),
      view: d.mapView, onView: v => { d.mapView = v; },
    });
  }

  const on = (id, fn) => document.getElementById(id)?.addEventListener('click', fn);
  on('prev', () => shift(-1));
  on('next', () => shift(1));
  $view.querySelectorAll('#dir button').forEach(b => { b.classList.toggle('active', b.dataset.d === d.dir); b.onclick = () => { tap(); d.dir = b.dataset.d; d.overview = false; d.step = 0; renderDriver(); }; });
  $view.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { tap();
    act('/driver/mark', { ...ref, userId: +b.dataset.m, result: b.dataset.res }, renderDriver); });
  $view.querySelectorAll('[data-paid]').forEach(b => b.onclick = async () => {
    if (await confirmBox(`${b.dataset.name} отдал ${money(+b.dataset.sum)} наличными?`))
      act('/driver/payment', { routeId: d.routeId, userId: +b.dataset.paid, amount: +b.dataset.sum }, renderDriver);
  });
  on('showQr', () => showQr(d.routeId));
  on('depart', () => act('/driver/depart', ref, r => { if (r.ok) d.step = 0; return renderDriver(); }));
  on('delay', async () => { const n = await choose('На сколько минут задерживаетесь?', [{ value: 5, text: '5 мин' }, { value: 10, text: '10 мин' }, { value: 15, text: '15 мин' }]); if (n) act('/driver/delay', { ...ref, minutes: n }); });
  on('go', async () => {
    tap();
    const stepsLeft = document.querySelectorAll('.steps i:not(.on)').length;
    if (stepsLeft) { d.step++; window.scrollTo(0, 0); return renderDriver(); }
    if (await confirmBox(morning ? 'Приехали в офис? Рейс будет завершён.' : 'Все доехали? Рейс будет завершён.')) act('/driver/arrived', ref, renderDriver);
  });
  on('backStep', () => { d.step--; renderDriver(); });
  on('toList', () => { d.overview = true; window.scrollTo(0, 0); renderDriver(); });
  on('backTrip', () => { d.overview = false; window.scrollTo(0, 0); renderDriver(); });
  on('cancel', async () => {
    if (await confirmBox('Отменить рейс? Все пассажиры получат уведомление.')) act('/driver/cancel', { ...ref, reason: '' }, renderDriver);
  });

  // Пока открыта вкладка, подтягиваем отметки пассажиров по QR.
  clearInterval(S.driverTimer);
  S.driverTimer = setInterval(() => S.tab === 'driver' && S.driver.view !== 'car' && !document.hidden && renderDriver().catch(() => { }), 20000);
}

// QR для посадки на весь экран — водитель показывает его пассажирам, они сканируют камерой.
function openQr(c) {
  const el = document.createElement('div');
  el.className = 'overlay';
  el.innerHTML = `<div class="title" style="font-size:20px">${esc(c.model)} · ${esc(c.plate)}</div>
    <img src="${c.qr}" alt="QR для посадки" />
    <div style="max-width:320px">Отсканируйте камерой телефона при посадке — поездка отметится сама</div>
    <button>Закрыть</button>`;
  el.onclick = e => { if (e.target.tagName !== 'IMG') el.remove(); };
  document.body.appendChild(el);
}
async function showQr(routeId) {
  try { openQr(await api('/driver/car?routeId=' + routeId)); } catch (e) { toast(e.message, false); }
}

// Машина водителя: фото салона и схема мест.
async function renderDriverCar(routes) {
  const d = S.driver;
  const c = await api('/driver/car?routeId=' + d.routeId);
  let layout = c.layout;

  $view.innerHTML = driverHead(routes, d) + `
    <h1>${esc(c.model)} · ${esc(c.plate)}</h1>
    <h2>QR для посадки</h2>
    <div class="card center" style="padding:16px">
      <img id="qrImg" src="${c.qr}" alt="QR для посадки" style="width:200px;max-width:70%;background:#fff;padding:8px;border-radius:10px;image-rendering:pixelated" />
      <div class="hint" style="margin:8px 0 12px">Пассажиры сканируют его при посадке — поездка отметится сама. Можно показать с экрана или распечатать в админке («Машины»).</div>
      <button class="primary block" id="qrBig">Показать на весь экран</button>
    </div>
    <h2>Фото салона</h2>
    <div class="card">
      ${c.photo ? `<img class="photo" src="${esc(c.photo)}" alt="Салон" />` : `<div class="hint" style="margin-bottom:10px">Фото пока нет. Пассажиры увидят его, когда будут выбирать место.</div>`}
      <div class="flex">
        <button class="primary grow" id="pick">${c.photo ? 'Заменить фото' : 'Загрузить фото'}</button>
        ${c.photo ? `<button class="line danger" id="delPhoto">Удалить</button>` : ''}
      </div>
      <input type="file" id="file" accept="image/*" hidden />
    </div>
    <h2>Схема мест · сейчас ${c.seats}</h2>
    <div class="card">
      <div id="editor"></div>
      <div class="spacer"></div>
      <button class="primary block" id="saveLayout">Сохранить схему</button>
      <div class="hint" style="margin-top:8px">Номера мест не меняются при правке схемы. Место, на которое записан пассажир, убрать нельзя.</div>
    </div>`;
  bindDriverHead(d);

  const editor = SeatEditor.mount(document.getElementById('editor'), layout, v => { layout = v; });
  document.getElementById('saveLayout').onclick = () => act('/driver/car/layout', { routeId: d.routeId, layout: editor.value }, renderDriver);

  document.getElementById('qrBig').onclick = () => openQr(c);
  document.getElementById('qrImg').onclick = () => openQr(c);

  const file = document.getElementById('file');
  document.getElementById('pick').onclick = () => file.click();
  file.onchange = async () => {
    const f = file.files[0];
    if (!f) return;
    toast('Загружаем фото…');
    try {
      const blob = await shrink(f);
      const form = new FormData();
      form.append('routeId', d.routeId);
      form.append('file', blob, 'salon.jpg');
      const r = await request('/driver/car/photo', { method: 'POST', headers: authHeaders(), body: form });
      toast(r.message, r.ok);
      if (r.ok) renderDriver();
    } catch (e) { toast(e.message, false); }
  };
  document.getElementById('delPhoto')?.addEventListener('click', async () => {
    if (await confirmBox('Удалить фото салона?')) act('/driver/car/photo/remove', { routeId: d.routeId }, renderDriver);
  });
}

// Уменьшаем фото в браузере: с телефона оно весит 5–10 МБ, для экрана хватит 1600 px.
async function shrink(file, max = 1600) {
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(bmp.width * k); canvas.height = Math.round(bmp.height * k);
    canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.82));
    if (blob) return blob;
  } catch { /* формат не поддержан браузером — отправим как есть */ }
  return file;
}

boot();
</script>
